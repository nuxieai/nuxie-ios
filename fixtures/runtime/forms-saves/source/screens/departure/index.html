<!doctype html><html><head><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="style.css"></head><body><main class="screen">
<header class="topbar"><button id="back" class="back" aria-label="Back" data-on:click="emit('back')"><span class="headline">←</span></button><p class="eyebrow">01 / 04 · YOUR TRIP</p></header>
<section class="intro"><h1 class="large-title">When do you<br>leave for Italy?</h1><p class="body">How many days until you go?<br>We’ll put the time you have to good use.</p></section>
<section class="countdown"><p class="eyebrow">I’M TRAVELLING IN</p><div class="stepper"><button id="minus" class="step" aria-label="One day less" data-on:click="set(state.days, calc(max(state.days - 1, 1)))"><span class="title-1">−</span></button><p class="count" data-bind="state.days | string">23</p><button id="plus" class="step" aria-label="One day more" data-on:click="set(state.days, calc(min(state.days + 1, 365)))"><span class="title-1">+</span></button></div><p class="body center">days</p></section>
<div class="wrap"><button id="week" class="pill" data-on:click="set(state.days, 7)"><span class="small-label">1 week</span></button><button id="month" class="pill" data-on:click="set(state.days, 30)"><span class="small-label">1 month</span></button><button id="months" class="pill" data-on:click="set(state.days, 90)"><span class="small-label">3 months</span></button></div>
<p class="footnote">Tap a starting point, then adjust the days.</p><div class="spacer"></div><footer class="footer"><button id="continue" class="cta" data-on:click="set(responses.onboarding.trip_days, state.days); save(responses.onboarding); emit('continue')"><span class="button-label">That’s my countdown</span></button><p class="footnote center">One short lesson for each day ahead.</p></footer>
</main></body></html>
