<!doctype html>
<html><head></head><body><main style="display:flex;flex-direction:column;gap:24px">
  <input id="name" aria-label="Name" data-bind:value.two-way="experience.name"
    data-on:focus="set(state.focused, 1)" data-on:blur="set(state.blurred, 1)"
    data-on:input="set(state.typed, 1)">
  <input id="surname" aria-label="Surname" data-bind:value.two-way="experience.surname"
    data-on:focus="set(state.focused, 1)" data-on:blur="set(state.blurred, 1)"
    data-on:input="set(state.typed, 1)">
</main></body></html>
