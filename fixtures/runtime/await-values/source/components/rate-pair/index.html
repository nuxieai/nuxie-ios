<!doctype html>
<html><head><link rel="stylesheet" href="style.css"></head><body>
<div id="rate_pair_root" class="rate_pair_root">
  <button id="rate_pair_four" class="rate_pair_button" data-on:click="props.rated(stars: 4, mood: 'glad', word: 'four', liked: true)"><p class="rate_pair_label">Rate four</p></button>
  <button id="rate_pair_two" class="rate_pair_button" data-on:click="props.rated(stars: 2, mood: 'calm', word: 'two', liked: false)"><p class="rate_pair_label">Rate two</p></button>
</div>
</body></html>
