[package]
name = "nux-apple-runtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
apple-product = ["nuxie/renderer", "nuxie/scripting"]

[dependencies]
nux-container = { path = "../../third_party/nuxie-runtime/crates/nux-container" }
nuxie = { path = "../../third_party/nuxie-runtime/crates/nuxie", default-features = false }
sha2 = "0.10"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
nuxie = { path = "../../third_party/nuxie-runtime/crates/nuxie", default-features = false, features = ["scripting"] }
nuxie-schema = { path = "../../third_party/nuxie-runtime/crates/nuxie-schema" }
png = "0.18"
serde_json = "1"

[[test]]
name = "experience_package_validator"
path = "tests/experience_package_validator.rs"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dev-dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLDrawable", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }

[build-dependencies]
cbindgen = "=0.29.2"
sha2 = "0.10"

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
