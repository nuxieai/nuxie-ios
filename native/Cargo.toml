[workspace]
members = ["nux-apple-runtime", "nuxie-apple-adapter"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/nuxieai/nuxie-ios"

[patch.crates-io]
# Keep the pinned engine's coherent luaur fork active at this SDK-owned
# workspace root. Cargo does not inherit patches from path dependencies.
luaur-ast = { path = "../third_party/nuxie-runtime/vendor/luaur-ast-0.1.8" }
luaur-bytecode = { path = "../third_party/nuxie-runtime/vendor/luaur-bytecode-0.1.8" }
luaur-common = { path = "../third_party/nuxie-runtime/vendor/luaur-common-0.1.8" }
luaur-compiler = { path = "../third_party/nuxie-runtime/vendor/luaur-compiler-0.1.8" }
luaur-rt = { path = "../third_party/nuxie-runtime/vendor/luaur-rt-0.1.8" }
luaur-vm = { path = "../third_party/nuxie-runtime/vendor/luaur-vm-0.1.8" }

[workspace.lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.release-apple]
inherits = "release"
panic = "unwind"
strip = "debuginfo"
