name: Release Nuxie iOS SDK

# The SDK release is the only versioned artifact. The Apple runtime
# XCFramework is built from whatever state native/nux-apple-runtime and the
# nested third_party/nuxie-runtime submodule are in at the released commit —
# it carries no version of its own. This workflow builds that artifact,
# rewrites the Package.swift binary pin to the release it is about to create,
# commits, tags, and publishes the immutable release with the archive
# attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to release (X.Y.Z, tagged as vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release-sdk:
    name: Build, pin, tag, and release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Validate the requested version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z, got '$VERSION'" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; SDK releases are immutable" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; SDK releases are immutable" >&2
            exit 1
          fi

      - name: Set up Apple CI
        uses: ./.github/actions/setup-apple-ci

      - name: Set up Rust for Apple targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools

      - name: Build and stage NuxieRuntime.xcframework
        run: make build-runtime-xcframework

      - name: Validate the staged runtime
        run: make check-staged-runtime-xcframework

      - name: Package the staged XCFramework
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/NuxieRuntime.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            .artifacts/NuxieRuntime.xcframework \
            "$archive"
          checksum="$(swift package compute-checksum "$archive")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          {
            echo "### SwiftPM checksum"
            echo
            echo "\`$checksum\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the release artifact in Package.swift
        env:
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/NuxieRuntime.xcframework.zip"
          perl -0pi -e "s{url: \"[^\"]+\"}{url: \"$url\"}" Package.swift
          perl -0pi -e "s{checksum: \"[0-9a-f]+\"}{checksum: \"$CHECKSUM\"}" Package.swift
          grep -F "$url" Package.swift >/dev/null
          grep -F "$CHECKSUM" Package.swift >/dev/null

      - name: Commit, tag, and push the release pin
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_revision="$(git -C third_party/nuxie-runtime rev-parse HEAD)"
          git config user.name "Levi McCallum"
          git config user.email "levi@levimccallum.com"
          git add Package.swift
          git commit -m "release: v${VERSION}" \
            -m "NuxieRuntime.xcframework built from nux-apple-runtime at this commit (nuxie-runtime ${runtime_revision})."
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"

      - name: Create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_revision="$(git -C third_party/nuxie-runtime rev-parse HEAD)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'SwiftPM checksum: `%s`\n\n' "$CHECKSUM"
            printf 'Apple runtime built from `native/nux-apple-runtime` at this release commit (nuxie-runtime engine `%s`).\n' "$runtime_revision"
          } > "$notes"
          gh release create "v${VERSION}" "$ARCHIVE" \
            --title "v${VERSION}" \
            --notes-file "$notes"
