name: Refresh Apple runtime

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the runtime inputs are unchanged
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-apple-runtime
  cancel-in-progress: false

jobs:
  refresh-runtime:
    name: Refresh runtime artifact
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true

      # The build embeds the SDK HEAD as sourceRevision, so a rebuild at a new
      # commit ALWAYS produces different bytes even when nothing about the
      # runtime changed. Deduplicating after the fact is therefore impossible -
      # neither normalized zip metadata nor an unpacked-payload comparison can
      # see through that embedded string. Decide up front instead: if the
      # provenance guard passes, the committed artifact already matches its
      # inputs and there is nothing to rebuild. Without this, every dispatch
      # would add another ~45 MB blob to history for an identical runtime.
      - name: Decide whether a rebuild is needed
        id: decide
        shell: bash
        run: |
          set -uo pipefail
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "Forced rebuild requested."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif make check-runtime-provenance; then
            echo "Runtime inputs are unchanged; the committed artifact is current."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Runtime inputs changed; rebuilding."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Apple CI
        if: steps.decide.outputs.needed == 'true'
        uses: ./.github/actions/setup-apple-ci

      - name: Set up Rust for Apple targets
        if: steps.decide.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools

      - name: Package NuxieRuntime.xcframework
        if: steps.decide.outputs.needed == 'true'
        run: make package-runtime-xcframework

      - name: Open a pull request if the runtime changed
        if: steps.decide.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- Runtime/)" ]]; then
            echo "Runtime artifact and provenance are already current."
            exit 0
          fi

          branch="automation/refresh-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "Levi McCallum"
          git config user.email "levi@levimccallum.com"
          git switch -c "$branch"
          git add Runtime/
          git commit -m "chore: refresh Apple runtime artifact"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh Apple runtime artifact" \
            --body "Refreshes the committed Apple runtime artifact and its source provenance."

          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows, so
          # dispatch the suite explicitly. If required checks are tied to the
          # pull_request event, use a GitHub App or PAT to make the PR mergeable.
          gh workflow run test.yml --ref "$branch"
