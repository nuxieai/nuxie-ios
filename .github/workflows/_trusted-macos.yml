name: Trusted macOS CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and native runtime (iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make test-unit test-native-runtime test-experience-input test-storekit build-ios-device

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore

  macos-build:
    name: Build (macOS)
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make build-macos

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore

  macos-unit:
    name: Unit (macOS)
    needs: macos-build
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make test-macos-unit

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore

  flow-runtime-ui:
    name: Experience Runtime UI (iOS)
    needs: macos-unit
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make test-experience-runtime-ui

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-runtime-ui-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore

  integration:
    name: Integration (iOS)
    needs: flow-runtime-ui
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make test-integration

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore

  e2e:
    name: E2E (iOS)
    needs: integration
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NUXIE_E2E_PHASE1: "1"
      NUXIE_E2E_PHASE2: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Apple CI
        id: apple-toolchain
        uses: ./.github/actions/setup-apple-ci

      - name: Reuse immutable Bazel actions and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-toolchain.outputs.xcode-identity }}-bazel-

      - name: Run native Bazel qualification
        run: make test-e2e

      - name: Upload native test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bazel-test-results
          path: |
            bazel-testlogs/**/*
            macos-unit-crash-reports/**/*
          retention-days: 5
          if-no-files-found: ignore
