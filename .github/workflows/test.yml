name: Tests

# Manual only: pull requests list their local checks (`make test`) in the
# pull request body instead of running repository CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-api:
    name: Public SDK API
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check public SDK API
        run: make check-public-api

  runtime-artifact:
    name: Runtime artifact
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check pure-Swift consumer ownership
        run: make check-runtime-consumer-boundary check-runtime-package-pin

      - name: Download and verify released runtime
        run: make fetch-runtime-xcframework-clean

      - name: Check Swift runtime module boundary
        run: make check-runtime-module-boundary

  apple-ci:
    name: Apple CI
    uses: ./.github/workflows/_trusted-macos.yml
