name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Hosted runners have isolated simulators, so only retain the newest run for
  # each branch or pull request. The group name also bypasses the stale queue
  # accumulated while the self-hosted runners were unavailable.
  group: nuxie-ios-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-artifact:
    name: Runtime artifact
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check pure-Swift consumer ownership
        run: make check-runtime-consumer-boundary check-runtime-package-pin

      - name: Download and verify released runtime
        run: make fetch-runtime-xcframework-clean

      - name: Check Swift runtime module boundary
        run: make check-runtime-module-boundary

  apple-ci:
    name: Apple CI
    # The nuxie-macos runner group admits only this reusable workflow at trusted
    # refs. Pinning the caller to the reviewed main commit keeps pull-request
    # YAML from changing the runner-routing decision.
    # GitHub snapshots runner-group workflow authorization when a run is created;
    # rerunning an older check suite does not rebuild that authorization graph.
    uses: nuxieai/nuxie-ios/.github/workflows/_trusted-macos.yml@28664a30b357298e04242e93773f8c49088fe0e7
    with:
      # No self-hosted macOS runners are currently registered. Keep CI moving
      # on isolated hosted runners until that capacity is restored.
      force_hosted: true
