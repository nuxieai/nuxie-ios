name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The two self-hosted listeners share one Mac and one CoreSimulator service.
  # Give fork PRs a disposable group while trusted runs serialize through the FIFO queue.
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('nuxie-ios-fork-{0}', github.run_id) || 'nuxie-ios-shared-simulator' }}
  queue: max

jobs:
  public-api:
    name: Public SDK API
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check public SDK API
        run: make check-public-api

  runtime-artifact:
    name: Runtime artifact
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check pure-Swift consumer ownership
        run: make check-runtime-consumer-boundary check-runtime-package-pin

      - name: Download and verify released runtime
        run: make fetch-runtime-xcframework-clean

      - name: Check Swift runtime module boundary
        run: make check-runtime-module-boundary

  apple-ci:
    name: Apple CI
    # Candidate workflows run on hosted macOS. The protected-main reusable
    # workflow alone selects persistent Nuxie runners after landing.
    uses: ./.github/workflows/_trusted-macos.yml
    with:
      force_hosted: ${{ github.ref != 'refs/heads/main' }}
