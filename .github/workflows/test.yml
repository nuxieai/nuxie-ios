name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The two self-hosted listeners share one Mac and one CoreSimulator service.
  # Give fork PRs a disposable group while trusted runs serialize through the FIFO queue.
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('nuxie-ios-fork-{0}', github.run_id) || 'nuxie-ios-shared-simulator' }}
  queue: max

jobs:
  # Pure git + shell: reads the recorded submodule gitlink, so it needs neither a
  # submodule clone nor macOS. Keep it that way so the guard stays fast enough to
  # front-run the expensive lanes.
  runtime-artifact:
    name: Runtime artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Needs commits and trees back to the artifact's source revision to prove
      # the recorded input hash belongs to it. blob:none keeps that cheap: trees
      # are fetched, the multi-megabyte archive blobs in history are not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check runtime provenance
        run: make check-runtime-provenance

  native-runtime:
    name: Native runtime
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Apple CI
        uses: ./.github/actions/setup-apple-ci

      - name: Set up Rust for Apple targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools

      - name: Test the Apple runtime crate on the host
        run: rustup run 1.94.1 cargo test --locked --manifest-path native/Cargo.toml -p nux-apple-runtime

      # Everything behind `apple-product` — the C ABI, the Metal surface seam,
      # and the package lifecycle cycles — compiles to zero tests without the
      # feature, so the step above never runs any of it. This runner is macOS,
      # so the Metal-backed cases can actually execute here.
      - name: Test the Apple runtime crate's product surface on the host
        run: rustup run 1.94.1 cargo test --locked --manifest-path native/Cargo.toml -p nux-apple-runtime --features apple-product

      - name: Build and stage NuxieRuntime.xcframework
        run: make build-runtime-xcframework

      - name: Validate the staged runtime
        run: make check-staged-runtime-xcframework

  apple-ci:
    name: Apple CI
    # The nuxie-macos runner group admits only this reusable workflow at trusted
    # refs. Pinning the caller to the reviewed main commit keeps pull-request
    # YAML from changing the runner-routing decision.
    # GitHub snapshots runner-group workflow authorization when a run is created;
    # rerunning an older check suite does not rebuild that authorization graph.
    uses: nuxieai/nuxie-ios/.github/workflows/_trusted-macos.yml@28664a30b357298e04242e93773f8c49088fe0e7
