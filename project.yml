name: NuxieSDK
options:
  bundleIdPrefix: com.nuxie
  deploymentTarget:
    iOS: 15.0
    macOS: 12.0
  generateEmptyDirectories: true
  groupSortPosition: top
  
packages:
  Quick:
    url: https://github.com/Quick/Quick.git
    from: 7.0.0
  Nimble:
    url: https://github.com/Quick/Nimble.git
    from: 13.0.0
    
targets:
  NuxieSDK:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Nuxie
        name: Nuxie
        excludes:
          - "**/*.md"
          - PrivacyInfo.xcprivacy
          - Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
          - Experiences/Runtime/ExperienceRuntimeFrameClock.swift
          - Experiences/Runtime/ExperienceRuntimeHost.swift
          - Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
          - Experiences/Runtime/NuxieRuntimeAdapter.swift
          - Experiences/Runtime/NuxieRuntimeImportRequest.swift
          - Experiences/Runtime/NuxieRuntimeResultDecoder.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeFrameClock.swift
        name: ExperienceRuntimeFrameClock.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
        name: ExperienceRuntimePackageAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeHost.swift
        name: ExperienceRuntimeHost.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
        name: ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeAdapter.swift
        name: NuxieRuntimeAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeImportRequest.swift
        name: NuxieRuntimeImportRequest.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeResultDecoder.swift
        name: NuxieRuntimeResultDecoder.swift
      - path: Sources/Nuxie/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk
      PRODUCT_NAME: Nuxie
      # Phase 1 guardrail: surface data races as warnings now; Phase 10 flips
      # the package to Swift 6 language mode (errors). Baseline recorded in the
      # cleanup plan — ratchet down, never up.
      SWIFT_STRICT_CONCURRENCY: complete
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieSDKMac:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Nuxie
        name: Nuxie
        excludes:
          - "**/*.md"
          - PrivacyInfo.xcprivacy
          - Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
          - Experiences/Runtime/ExperienceRuntimeFrameClock.swift
          - Experiences/Runtime/ExperienceRuntimeHost.swift
          - Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
          - Experiences/Runtime/NuxieRuntimeAdapter.swift
          - Experiences/Runtime/NuxieRuntimeImportRequest.swift
          - Experiences/Runtime/NuxieRuntimeResultDecoder.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeFrameClock.swift
        name: ExperienceRuntimeFrameClock.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
        name: ExperienceRuntimePackageAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeHost.swift
        name: ExperienceRuntimeHost.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
        name: ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeAdapter.swift
        name: NuxieRuntimeAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeImportRequest.swift
        name: NuxieRuntimeImportRequest.swift
      - path: Sources/Nuxie/Experiences/Runtime/NuxieRuntimeResultDecoder.swift
        name: NuxieRuntimeResultDecoder.swift
      - path: Sources/Nuxie/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.macos
      PRODUCT_NAME: Nuxie
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieTestSupportiOS:
    type: framework
    platform: iOS
    sources:
      - path: Tests/NuxieTestSupport
        name: NuxieTestSupport
    dependencies:
      - target: NuxieSDK
      - package: Quick
      - package: Nimble
      - sdk: XCTest.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.testsupport.ios
      PRODUCT_NAME: NuxieTestSupport
      PRODUCT_MODULE_NAME: NuxieTestSupport
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieTestSupportMac:
    type: framework
    platform: macOS
    sources:
      - path: Tests/NuxieTestSupport
        name: NuxieTestSupport
    dependencies:
      - target: NuxieSDKMac
      - package: Quick
      - package: Nimble
      - sdk: XCTest.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.testsupport.macos
      PRODUCT_NAME: NuxieTestSupport
      PRODUCT_MODULE_NAME: NuxieTestSupport
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      
  NuxieSDKUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NuxieUnitTests
        name: NuxieUnitTests
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
      - target: NuxieTestSupportiOS
      - package: Quick
      - package: Nimble
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.unittests
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKUnitTests
      gatherCoverageData: true

  NuxieSDKMacUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NuxieUnitTests
        name: NuxieUnitTests
    dependencies:
      - target: NuxieSDKMac
      - target: NuxieTestSupportMac
      - package: Quick
      - package: Nimble
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.macos.unittests
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKMacUnitTests
      gatherCoverageData: true

  NuxieSDKIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NuxieIntegrationTests
        name: NuxieIntegrationTests
    dependencies:
      - target: NuxieSDK
      - target: NuxieTestSupportiOS
      - package: Quick
      - package: Nimble
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.integrationtests
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKIntegrationTests
      gatherCoverageData: false

  NuxieExperienceRuntimeHostApp:
    type: application
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeHostApp/Sources
        name: ExperienceRuntimeHostApp
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-host
      PRODUCT_NAME: NuxieExperienceRuntimeHost
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Tests/ExperienceRuntimeHostApp/Sources/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieExperienceRuntimeReferenceApp:
    type: application
    platform: iOS
    sources:
      - path: Examples/ExperienceRuntimeReferenceApp/Sources
        name: ExperienceRuntimeReferenceApp
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-reference
      PRODUCT_NAME: NuxieExperienceRuntimeReference
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Examples/ExperienceRuntimeReferenceApp/Sources/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EApp:
    type: application
    platform: iOS
    sources:
      - path: Examples/E2EApp/Sources
        name: E2EApp
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp
      PRODUCT_NAME: NuxieE2EApp
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Examples/E2EApp/Sources/App/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Examples/E2EApp/Tests/Unit
        name: E2EAppTests
    dependencies:
      - target: NuxieE2EApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp.tests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Examples/E2EApp/Tests/UI
        name: E2EAppUITests
    dependencies:
      - target: NuxieE2EApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp.uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieExperienceRuntimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeUITests
        name: ExperienceRuntimeUITests
    dependencies:
      - target: NuxieExperienceRuntimeHostApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieExperienceRuntimeUITests
      gatherCoverageData: false

  NuxieExperienceRuntimeReferenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeReferenceUITests
        name: ExperienceRuntimeReferenceUITests
    dependencies:
      - target: NuxieExperienceRuntimeReferenceApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-reference-uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieExperienceRuntimeReferenceUITests
      gatherCoverageData: false

schemes:
  NuxieSDK:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKUnitTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release

  NuxieSDKMac:
    build:
      targets:
        NuxieSDKMac: all
    run:
      config: Debug
    archive:
      config: Release

  NuxieExperienceRuntimeReferenceApp:
    build:
      targets:
        NuxieExperienceRuntimeReferenceApp: all
    run:
      config: Debug
    archive:
      config: Release

  NuxieExperienceRuntimeReferenceUITests:
    build:
      targets:
        NuxieExperienceRuntimeReferenceApp: all
        NuxieExperienceRuntimeReferenceUITests: all
    test:
      targets:
        - NuxieExperienceRuntimeReferenceUITests
      gatherCoverageData: false

  NuxieSDKUnitTests:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKUnitTests
      gatherCoverageData: true

  NuxieSDKMacUnitTests:
    build:
      targets:
        NuxieSDKMac: all
    test:
      targets:
        - NuxieSDKMacUnitTests
      gatherCoverageData: true

  NuxieSDKIntegrationTests:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKIntegrationTests
      gatherCoverageData: false

  NuxieExperienceRuntimeUITests:
    build:
      targets:
        NuxieExperienceRuntimeHostApp: all
        NuxieExperienceRuntimeUITests: all
    test:
      targets:
        - NuxieExperienceRuntimeUITests
      gatherCoverageData: false

  NuxieSDKE2ETests:
    build:
      targets:
        NuxieE2EApp: all
        NuxieE2EAppTests: all
        NuxieE2EAppUITests: all
    test:
      targets:
        - NuxieE2EAppTests
        - NuxieE2EAppUITests
      gatherCoverageData: false
