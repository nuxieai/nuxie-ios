name: NuxieSDK
options:
  bundleIdPrefix: com.nuxie
  deploymentTarget:
    iOS: 15.0
    macOS: 12.0
  generateEmptyDirectories: true
  groupSortPosition: top
  
packages:
  Quick:
    url: https://github.com/Quick/Quick.git
    from: 7.0.0
  Nimble:
    url: https://github.com/Quick/Nimble.git
    from: 13.0.0
    
targets:
  NuxieRuntimeSupport:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/NuxieRuntime/ExperienceRuntimeFontRegistry.swift
      - path: Sources/NuxieRuntime/ExperienceRuntimeHost.swift
      - path: Sources/NuxieRuntime/NuxieRuntimeSerialExecutor.swift
      - path: Sources/NuxieRuntime/ScreenSessionTypes.swift
    dependencies:
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CryptoKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.runtime.support
      PRODUCT_NAME: NuxieRuntimeSupport
      PRODUCT_MODULE_NAME: NuxieRuntimeSupport
      SWIFT_PACKAGE_NAME: Nuxie
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_VERSION: 5.9
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieRuntimeSupportMac:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/NuxieRuntime/ExperienceRuntimeFontRegistry.swift
      - path: Sources/NuxieRuntime/ExperienceRuntimeHost.swift
      - path: Sources/NuxieRuntime/NuxieRuntimeSerialExecutor.swift
      - path: Sources/NuxieRuntime/ScreenSessionTypes.swift
    dependencies:
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CryptoKit.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.runtime.support.macos
      PRODUCT_NAME: NuxieRuntimeSupport
      PRODUCT_MODULE_NAME: NuxieRuntimeSupport
      SWIFT_PACKAGE_NAME: Nuxie
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_VERSION: 5.9
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieRuntime:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/NuxieRuntime
        name: NuxieRuntime
        excludes:
          - NuxieRuntimeAdapter.swift
          - NuxieRuntimeImportRequest.swift
          - NuxieRuntimeResultDecoder.swift
          - NuxieRuntimeStatus.swift
          - ExperienceRuntimeFontRegistry.swift
          - ExperienceRuntimeHost.swift
          - NuxieRuntimeSerialExecutor.swift
          - ScreenSessionTypes.swift
    dependencies:
      - target: NuxieRuntimeSupport
        link: true
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.runtime
      PRODUCT_NAME: NuxieRuntime
      PRODUCT_MODULE_NAME: NuxieRuntime
      SWIFT_PACKAGE_NAME: Nuxie
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_VERSION: 5.9
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieRuntimeMac:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/NuxieRuntime
        name: NuxieRuntime
        excludes:
          - NuxieRuntimeAdapter.swift
          - NuxieRuntimeImportRequest.swift
          - NuxieRuntimeResultDecoder.swift
          - NuxieRuntimeStatus.swift
          - ExperienceRuntimeFontRegistry.swift
          - ExperienceRuntimeHost.swift
          - NuxieRuntimeSerialExecutor.swift
          - ScreenSessionTypes.swift
    dependencies:
      - target: NuxieRuntimeSupportMac
        link: true
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CryptoKit.framework
      - sdk: ImageIO.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.runtime.macos
      PRODUCT_NAME: NuxieRuntime
      PRODUCT_MODULE_NAME: NuxieRuntime
      SWIFT_PACKAGE_NAME: Nuxie
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_VERSION: 5.9
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  # Temporary v0.4.0 containment boundary. The released legacy and portable
  # headers reuse one incompatible C tag, so they cannot be imported into one
  # Swift module under Xcode explicit-module validation. UNIV-1831 removes
  # this target after the product cutover; no new code may depend on it.
  NuxieRuntimeLegacy:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/NuxieRuntime/NuxieRuntimeAdapter.swift
      - path: Sources/NuxieRuntime/NuxieRuntimeImportRequest.swift
      - path: Sources/NuxieRuntime/NuxieRuntimeResultDecoder.swift
      - path: Sources/NuxieRuntime/NuxieRuntimeStatus.swift
    dependencies:
      - target: NuxieRuntimeSupport
        link: false
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.runtime.legacy
      PRODUCT_NAME: NuxieRuntimeLegacy
      PRODUCT_MODULE_NAME: NuxieRuntimeLegacy
      SWIFT_PACKAGE_NAME: Nuxie
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_VERSION: 5.9
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieSDK:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Nuxie
        name: Nuxie
        excludes:
          - "**/*.md"
          - PrivacyInfo.xcprivacy
          - Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
          - Experiences/Runtime/ExperienceRuntimeFrameClock.swift
          - Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeFrameClock.swift
        name: ExperienceRuntimeFrameClock.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
        name: ExperienceRuntimePackageAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
        name: ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: NuxieRuntime
        link: true
      - target: NuxieRuntimeSupport
        link: false
      - target: NuxieRuntimeLegacy
        link: true
      # Xcode does not propagate a static target's binary dependencies to the
      # final framework link. This is a linker input only; SDK source may not
      # import NuxieRuntimeFFI (enforced by check-runtime-module-boundary).
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk
      PRODUCT_NAME: Nuxie
      # Phase 1 guardrail: surface data races as warnings now; Phase 10 flips
      # the package to Swift 6 language mode (errors). Baseline recorded in the
      # cleanup plan — ratchet down, never up.
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_PACKAGE_NAME: Nuxie
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieSDKMac:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Nuxie
        name: Nuxie
        excludes:
          - "**/*.md"
          - PrivacyInfo.xcprivacy
          - Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
          - Experiences/Runtime/ExperienceRuntimeFrameClock.swift
          - Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeFrameClock.swift
        name: ExperienceRuntimeFrameClock.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimePackageAdapter.swift
        name: ExperienceRuntimePackageAdapter.swift
      - path: Sources/Nuxie/Experiences/Runtime/ExperienceRuntimeSurfaceView.swift
        name: ExperienceRuntimeSurfaceView.swift
      - path: Sources/Nuxie/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: NuxieRuntimeMac
        link: true
      - target: NuxieRuntimeSupportMac
        link: false
      # Static target binary dependencies are not propagated to the final
      # framework link, so the released runtime remains an explicit input.
      - framework: .artifacts/NuxieRuntime.xcframework
        embed: false
        link: true
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.macos
      PRODUCT_NAME: Nuxie
      SWIFT_PACKAGE_NAME: Nuxie
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieTestSupportiOS:
    type: framework
    platform: iOS
    sources:
      - path: Tests/NuxieTestSupport
        name: NuxieTestSupport
    dependencies:
      - target: NuxieSDK
      - target: NuxieRuntimeSupport
        link: false
      - package: Quick
      - package: Nimble
      - sdk: XCTest.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.testsupport.ios
      PRODUCT_NAME: NuxieTestSupport
      PRODUCT_MODULE_NAME: NuxieTestSupport
      SWIFT_PACKAGE_NAME: Nuxie
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieTestSupportMac:
    type: framework
    platform: macOS
    sources:
      - path: Tests/NuxieTestSupport
        name: NuxieTestSupport
    dependencies:
      - target: NuxieSDKMac
      - target: NuxieRuntimeSupportMac
        link: false
      - package: Quick
      - package: Nimble
      - sdk: XCTest.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.testsupport.macos
      PRODUCT_NAME: NuxieTestSupport
      PRODUCT_MODULE_NAME: NuxieTestSupport
      SWIFT_PACKAGE_NAME: Nuxie
      ENABLE_TESTABILITY: YES
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      
  NuxieSDKUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NuxieUnitTests
        name: NuxieUnitTests
        excludes:
          - Experiences/NuxieRuntimeAdapterTests.swift
          - Experiences/NuxieRuntimeFixtureTraceTests.swift
          - Experiences/NuxieRuntimeModuleTests.swift
          - Experiences/NuxieRuntimeNativeResultSeamTests.swift
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
      - target: NuxieRuntime
        link: false
      - target: NuxieRuntimeSupport
        link: false
      - target: NuxieTestSupportiOS
      - package: Quick
      - package: Nimble
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.unittests
      SWIFT_PACKAGE_NAME: Nuxie
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKUnitTests
      gatherCoverageData: true

  NuxieRuntimeLegacyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NuxieUnitTests
        name: NuxieUnitTests
        includes:
          - Experiences/NuxieRuntimeAdapterTests.swift
          - Experiences/NuxieRuntimeFixtureTraceTests.swift
          - Experiences/NuxieRuntimeModuleTests.swift
          - Experiences/NuxieRuntimeNativeResultSeamTests.swift
          - Experiences/RuntimePackageFixtureSupport.swift
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
      - target: NuxieRuntimeLegacy
        link: false
      - target: NuxieRuntimeSupport
        link: false
      - target: NuxieTestSupportiOS
      - package: Quick
      - package: Nimble
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.runtime-legacy-tests
      SWIFT_PACKAGE_NAME: Nuxie
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieRuntimeLegacyTests
      gatherCoverageData: true

  NuxieSDKMacUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NuxieUnitTests
        name: NuxieUnitTests
    dependencies:
      - target: NuxieSDKMac
      - target: NuxieRuntimeMac
        link: false
      - target: NuxieTestSupportMac
      - package: Quick
      - package: Nimble
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.macos.unittests
      SWIFT_PACKAGE_NAME: Nuxie
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKMacUnitTests
      gatherCoverageData: true

  NuxieSDKIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NuxieIntegrationTests
        name: NuxieIntegrationTests
    dependencies:
      - target: NuxieSDK
      - target: NuxieRuntime
        link: false
      - target: NuxieTestSupportiOS
      - package: Quick
      - package: Nimble
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.integrationtests
      SWIFT_PACKAGE_NAME: Nuxie
      TEST_HOST: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SWIFT_PACKAGE
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieSDKIntegrationTests
      gatherCoverageData: false

  NuxieExperienceRuntimeHostApp:
    type: application
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeHostApp/Sources
        name: ExperienceRuntimeHostApp
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-host
      PRODUCT_NAME: NuxieExperienceRuntimeHost
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Tests/ExperienceRuntimeHostApp/Sources/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieExperienceRuntimeReferenceApp:
    type: application
    platform: iOS
    sources:
      - path: Examples/ExperienceRuntimeReferenceApp/Sources
        name: ExperienceRuntimeReferenceApp
      - path: Tests/ExperienceRuntimeHostApp/Fixtures
        type: folder
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-reference
      PRODUCT_NAME: NuxieExperienceRuntimeReference
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Examples/ExperienceRuntimeReferenceApp/Sources/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EApp:
    type: application
    platform: iOS
    sources:
      - path: Examples/E2EApp/Sources
        name: E2EApp
    dependencies:
      - target: NuxieSDK
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp
      PRODUCT_NAME: NuxieE2EApp
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
      SWIFT_VERSION: 5.9
      INFOPLIST_FILE: Examples/E2EApp/Sources/App/Info.plist
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Examples/E2EApp/Tests/Unit
        name: E2EAppTests
    dependencies:
      - target: NuxieE2EApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp.tests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieE2EAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Examples/E2EApp/Tests/UI
        name: E2EAppUITests
    dependencies:
      - target: NuxieE2EApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.nuxie.e2eapp.uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""

  NuxieExperienceRuntimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeUITests
        name: ExperienceRuntimeUITests
    dependencies:
      - target: NuxieExperienceRuntimeHostApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieExperienceRuntimeUITests
      gatherCoverageData: false

  NuxieExperienceRuntimeReferenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ExperienceRuntimeReferenceUITests
        name: ExperienceRuntimeReferenceUITests
    dependencies:
      - target: NuxieExperienceRuntimeReferenceApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nuxie.sdk.experience-runtime-reference-uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - NuxieExperienceRuntimeReferenceUITests
      gatherCoverageData: false

schemes:
  NuxieSDK:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKUnitTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release

  NuxieSDKMac:
    build:
      targets:
        NuxieSDKMac: all
    run:
      config: Debug
    archive:
      config: Release

  NuxieExperienceRuntimeReferenceApp:
    build:
      targets:
        NuxieExperienceRuntimeReferenceApp: all
    run:
      config: Debug
    archive:
      config: Release

  NuxieExperienceRuntimeReferenceUITests:
    build:
      targets:
        NuxieExperienceRuntimeReferenceApp: all
        NuxieExperienceRuntimeReferenceUITests: all
    test:
      targets:
        - NuxieExperienceRuntimeReferenceUITests
      gatherCoverageData: false

  NuxieSDKUnitTests:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKUnitTests
      gatherCoverageData: true

  NuxieSDKMacUnitTests:
    build:
      targets:
        NuxieSDKMac: all
    test:
      targets:
        - NuxieSDKMacUnitTests
      gatherCoverageData: true

  NuxieSDKIntegrationTests:
    build:
      targets:
        NuxieSDK: all
    test:
      targets:
        - NuxieSDKIntegrationTests
      gatherCoverageData: false

  NuxieExperienceRuntimeUITests:
    build:
      targets:
        NuxieExperienceRuntimeHostApp: all
        NuxieExperienceRuntimeUITests: all
    test:
      targets:
        - NuxieExperienceRuntimeUITests
      gatherCoverageData: false

  NuxieSDKE2ETests:
    build:
      targets:
        NuxieE2EApp: all
        NuxieE2EAppTests: all
        NuxieE2EAppUITests: all
    test:
      targets:
        - NuxieE2EAppTests
        - NuxieE2EAppUITests
      gatherCoverageData: false
