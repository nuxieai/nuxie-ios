env:
  CI: "1"

steps:
  - label: ":apple: SDK and released runtime validation"
    command: |
      set -euo pipefail
      make check-runtime-consumer-boundary check-runtime-package-pin
      make fetch-runtime-xcframework
      make verify-runtime-artifact check-runtime-module-boundary
      make test
      make build-ios-device
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    concurrency: 1
    concurrency_group: nuxie-macos-xcode
    timeout_in_minutes: 180
    artifact_paths:
      - "*TestResults.xcresult/**/*"
      - "macos-unit-crash-reports/**/*"
    retry:
      automatic:
        - exit_status: -1
          limit: 1
